# /etc/systemd/system/pi-dmx-watchdog.service.d/quiet.conf (2026-09-30, installeras av tools/ladan_b.py)
# Timern kor var 30:e s; varje korning ger "Starting/Deactivated/Finished" = ~360 journalrader/h dygnet runt
# (samma monster som lotus-corpus-stormen: ~100 MB/h SD-skrivningar med persistent journal). notice slapper igenom
# watchdogens egen logger-rad ("restarting") men inte rutinraderna. Verifiera med journalctl -u pi-dmx-watchdog.
[Service]
LogLevelMax=notice
