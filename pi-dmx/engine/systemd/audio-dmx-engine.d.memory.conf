# /etc/systemd/system/audio-dmx-engine.service.d/memory.conf (2026-09-30, installeras av tools/ladan_b.py)
# VERKAR FORST NAR cmdline.txt har cgroup_enable=memory cgroup_memory=1 (firmware lagger in cgroup_disable=memory;
# senare flagga vinner - samma fix som lotus 08-23). Utan den ignoreras raderna tyst.
# Motorn far aldrig swappa (GC-svep genom swap = sekundlanga frysningar, lotus 08-23). Tak 300 MB: RSS ~180 MB efter
# uppvarmningen, heap 96 - ett riktigt lack blir en ren OOM-omstart (Restart=always, 2 s) i stallet for en frys.
[Service]
MemorySwapMax=0
MemoryMax=300M
