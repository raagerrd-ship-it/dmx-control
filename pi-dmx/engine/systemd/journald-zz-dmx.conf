# /etc/systemd/journald.conf.d/zz-dmx.conf (2026-09-30, installeras av tools/ladan_b.py)
# Journalen i RAM: ingen SD-slitning, ryms i /run. Supportfonstret ar /api/health-log (ringbuffert i minnet) - journalen
# behovs bara inom samma boot (motorns omstarter ar Restart=always, ingen reboot).
[Journal]
Storage=volatile
RuntimeMaxUse=8M
RateLimitIntervalSec=30s
RateLimitBurst=1000
