# /etc/systemd/journald.conf.d/zz-dmx.conf (2026-09-30, installeras av tools/ladan_b.py)
# SPARAD JOURNAL (agaren i ladan 2026-10-09): Pi:n startade om abrupt tre ganger pa 25 min (ingen nedstangning i wtmp, ingen
# vakthund aktiv) och journalen lag i RAM - orsaken gick inte att se. Nu sparas den pa kortet: hogst 40 MB / 30 dagar, synk var
# 30:e sekund (kritiska karnmeddelanden som underspanning synkas direkt av journald). Forr: Storage=volatile, RuntimeMaxUse=8M.
[Journal]
Storage=persistent
SystemMaxUse=40M
MaxRetentionSec=30day
SyncIntervalSec=30s
RuntimeMaxUse=8M
RateLimitIntervalSec=30s
RateLimitBurst=1000
